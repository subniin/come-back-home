; VS Code + PlatformIO 설정
; src/ 폴더(firmware.cpp + core/)를 그대로 빌드. test/ 는 PC 시뮬레이션용이라 빌드에 포함되지 않음

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; BLE 라이브러리가 커서 기본 파티션이면 용량 초과가 날 수 있음
board_build.partitions = huge_app.csv

; 시리얼 모니터: 115200, 엔터 칠 때 한 줄 전송(LF)
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_filters = send_on_enter, esp32_exception_decoder
